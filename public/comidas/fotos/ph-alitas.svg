<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <filter id="agua1" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="4" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="17" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="0.9"/>
    </filter>
    <filter id="agua2" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="44" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="13" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="1.3"/>
    </filter>
    <filter id="pluma" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grano" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="#FDF8F2"/>
  <!-- El dibujo va agrandado: en el móvil la tarjeta recorta un cuadrado pequeño. -->
  <g transform="translate(200 150) scale(1.3) translate(-200 -150)">
  <ellipse cx="200.0" cy="178.0" rx="112.0" ry="46.0" fill="#F0E0CB" opacity="0.45" filter="url(#agua2)"/>
  <ellipse cx="144.4" cy="169.8" rx="30.0" ry="20.0" fill="#D9A441" opacity="0.6" filter="url(#agua2)"/>
  <ellipse cx="138.4" cy="165.8" rx="16.0" ry="10.0" fill="#E8C57E" opacity="0.5" filter="url(#agua2)"/>
  <path d="M 116.42884924728423 173.82263603433967 q 28 -26 56 0" fill="none" stroke="#5A4A42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" filter="url(#pluma)"/>
  <ellipse cx="198.1" cy="164.1" rx="30.0" ry="20.0" fill="#D9A441" opacity="0.6" filter="url(#agua1)"/>
  <ellipse cx="192.1" cy="160.1" rx="16.0" ry="10.0" fill="#E8C57E" opacity="0.5" filter="url(#agua2)"/>
  <path d="M 170.10621537314728 168.07286163046956 q 28 -26 56 0" fill="none" stroke="#5A4A42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" filter="url(#pluma)"/>
  <ellipse cx="258.3" cy="172.9" rx="30.0" ry="20.0" fill="#D9A441" opacity="0.6" filter="url(#agua2)"/>
  <ellipse cx="252.3" cy="168.9" rx="16.0" ry="10.0" fill="#E8C57E" opacity="0.5" filter="url(#agua2)"/>
  <path d="M 230.29337236192077 176.86197089403868 q 28 -26 56 0" fill="none" stroke="#5A4A42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" filter="url(#pluma)"/>
  <ellipse cx="258.0" cy="208.0" rx="14.0" ry="7.0" fill="#8CA07A" opacity="0.55" filter="url(#agua2)"/>
  <ellipse cx="150.0" cy="206.0" rx="11.0" ry="6.0" fill="#B6C49B" opacity="0.55" filter="url(#agua1)"/>
  <path d="M 88 190 q 112 46 224 0" fill="none" stroke="#5A4A42" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" filter="url(#pluma)"/>
  </g>
  <rect width="400" height="300" filter="url(#grano)" opacity="0.07" style="mix-blend-mode: multiply"/>
</svg>
