<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <filter id="agua1" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="4" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="17" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="0.9"/>
    </filter>
    <filter id="agua2" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="44" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="13" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="1.3"/>
    </filter>
    <filter id="pluma" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="16" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grano" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="#FDF8F2"/>
  <!-- El dibujo va agrandado: en el móvil la tarjeta recorta un cuadrado pequeño. -->
  <g transform="translate(200 150) scale(1.3) translate(-200 -150)">
  <ellipse cx="200.0" cy="180.0" rx="118.0" ry="44.0" fill="#F0E0CB" opacity="0.45" filter="url(#agua2)"/>
  <path d="M 112 176 Q 188 124 262 176 Q 188 226 112 176 Z" fill="#C85D48" opacity="0.42" filter="url(#agua1)"/>
  <path d="M 132 176 Q 190 142 246 176 Q 190 206 132 176 Z" fill="#D9A441" opacity="0.3" filter="url(#agua2)"/>
  <path d="M 258 176 L 300 148 L 294 176 L 300 204 Z" fill="#C85D48" opacity="0.45" filter="url(#agua1)"/>
  <path d="M 112 176 Q 188 124 262 176 Q 188 226 112 176" fill="none" stroke="#5A4A42" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.45" filter="url(#pluma)"/>
  <path d="M 258 176 L 300 148 L 294 176 L 300 204 Z" fill="none" stroke="#5A4A42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" filter="url(#pluma)"/>
  <ellipse cx="140.0" cy="170.0" rx="3.5" ry="3.5" fill="#5A4A42" opacity="0.6" filter="url(#agua2)"/>
  <path d="M 176 160 q 10 16 0 32 M 200 158 q 10 18 0 36" fill="none" stroke="#5A4A42" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.3" filter="url(#pluma)"/>
  <ellipse cx="104.0" cy="212.0" rx="20.0" ry="14.0" fill="#D9A441" opacity="0.55" filter="url(#agua1)"/>
  <ellipse cx="290.0" cy="216.0" rx="12.0" ry="7.0" fill="#8CA07A" opacity="0.55" filter="url(#agua2)"/>
  </g>
  <rect width="400" height="300" filter="url(#grano)" opacity="0.07" style="mix-blend-mode: multiply"/>
</svg>
