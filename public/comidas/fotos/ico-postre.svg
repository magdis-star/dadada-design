<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <filter id="agua" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="4" seed="90" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="26" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <filter id="pluma" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="95" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grano" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="#FDF8F2"/>
  <g filter="url(#agua)" opacity="0.7"><g transform="translate(107 58) scale(8.1)"><path fill="#FFF8F1" stroke="none" d="M3 19.5h18v-8L3 15.5Z"/><path fill="#F0C77E" stroke="none" d="M3 17.5h18v2H3Z"/><circle fill="#EBA08D" stroke="none" cx="16" cy="9" r="1.7"/></g></g>
  <g filter="url(#agua)" opacity="0.3"><g transform="translate(100 50) scale(8)"><path fill="#FFF8F1" stroke="none" d="M3 19.5h18v-8L3 15.5Z"/><path fill="#F0C77E" stroke="none" d="M3 17.5h18v2H3Z"/><circle fill="#EBA08D" stroke="none" cx="16" cy="9" r="1.7"/></g></g>
  <g filter="url(#pluma)"><g transform="translate(104 54) scale(8)" fill="none" stroke="#5A4A42" stroke-width="0.62" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"><path d="M3 19.5h18v-8L3 15.5Z"/><path d="M3 17.5h18"/><path d="M3 15.5l18-4"/><circle cx="16" cy="9" r="1.7"/><path d="M16 7.3c.3-1.4 1.2-2.4 2.5-2.9"/></g></g>
