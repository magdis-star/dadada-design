<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <filter id="agua" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="4" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="26" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <filter id="pluma" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="12" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grano" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="#FDF8F2"/>
  <g filter="url(#agua)" opacity="0.7"><g transform="translate(107 58) scale(8.1)"><circle fill="#FFF8F1" stroke="none" cx="12" cy="12.5" r="6"/><circle fill="#F0C77E" stroke="none" cx="12" cy="12.5" r="3.6"/></g></g>
  <g filter="url(#agua)" opacity="0.3"><g transform="translate(100 50) scale(8)"><circle fill="#FFF8F1" stroke="none" cx="12" cy="12.5" r="6"/><circle fill="#F0C77E" stroke="none" cx="12" cy="12.5" r="3.6"/></g></g>
  <g filter="url(#pluma)"><g transform="translate(104 54) scale(8)" fill="none" stroke="#5A4A42" stroke-width="0.62" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"><circle cx="12" cy="12.5" r="6"/><circle cx="12" cy="12.5" r="3.6"/><path d="M3 4v5.5a1.5 1.5 0 0 0 3 0V4M4.5 9.5V20.5M20 4c-1.8.8-2.7 3-2.7 5.5 0 1.5.9 2.5 2.2 2.5H20v8.5"/></g></g>
  <rect width="400" height="300" filter="url(#grano)" opacity="0.06" style="mix-blend-mode: multiply"/>
