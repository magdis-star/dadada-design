<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <filter id="agua1" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="4" seed="25" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="17" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="0.9"/>
    </filter>
    <filter id="agua2" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="24" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="13" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="1.3"/>
    </filter>
    <filter id="pluma" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="32" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grano" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="#FDF8F2"/>
  <!-- El dibujo va agrandado: en el móvil la tarjeta recorta un cuadrado pequeño. -->
  <g transform="translate(200 150) scale(1.3) translate(-200 -150)">
  <ellipse cx="200.0" cy="176.0" rx="108.0" ry="42.0" fill="#AFA79D" opacity="0.2" filter="url(#agua2)"/>
  <ellipse cx="186.0" cy="176.9" rx="28.8" ry="10.3" fill="#B6C49B" opacity="0.55" filter="url(#agua2)"/>
  <ellipse cx="145.7" cy="167.3" rx="29.2" ry="12.9" fill="#B6C49B" opacity="0.55" filter="url(#agua1)"/>
  <ellipse cx="164.6" cy="184.9" rx="22.6" ry="15.9" fill="#8CA07A" opacity="0.55" filter="url(#agua2)"/>
  <ellipse cx="213.6" cy="173.7" rx="18.5" ry="13.1" fill="#B6C49B" opacity="0.55" filter="url(#agua1)"/>
  <ellipse cx="197.2" cy="188.2" rx="27.2" ry="10.2" fill="#8CA07A" opacity="0.55" filter="url(#agua1)"/>
  <ellipse cx="187.0" cy="167.7" rx="22.2" ry="10.1" fill="#B6C49B" opacity="0.55" filter="url(#agua2)"/>
  <ellipse cx="214.5" cy="169.1" rx="23.3" ry="13.3" fill="#8CA07A" opacity="0.55" filter="url(#agua2)"/>
  <ellipse cx="213.4" cy="195.2" rx="29.0" ry="10.5" fill="#8CA07A" opacity="0.55" filter="url(#agua1)"/>
  <ellipse cx="242.0" cy="173.0" rx="25.4" ry="12.1" fill="#8CA07A" opacity="0.55" filter="url(#agua2)"/>
  <ellipse cx="217.4" cy="170.5" rx="26.8" ry="12.1" fill="#8CA07A" opacity="0.55" filter="url(#agua2)"/>
  <ellipse cx="186.2" cy="168.8" rx="18.8" ry="13.1" fill="#8CA07A" opacity="0.55" filter="url(#agua1)"/>
  <ellipse cx="239.7" cy="181.5" rx="9.0" ry="8.0" fill="#C85D48" opacity="0.6" filter="url(#agua2)"/>
  <ellipse cx="233.6" cy="175.1" rx="9.0" ry="8.0" fill="#C85D48" opacity="0.6" filter="url(#agua2)"/>
  <ellipse cx="180.5" cy="159.1" rx="9.0" ry="8.0" fill="#C85D48" opacity="0.6" filter="url(#agua2)"/>
  <ellipse cx="228.1" cy="178.1" rx="9.0" ry="8.0" fill="#C85D48" opacity="0.6" filter="url(#agua2)"/>
  <path d="M 96 172 q 8 54 104 54 q 96 0 104 -54" fill="none" stroke="#5A4A42" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.42" filter="url(#pluma)"/>
  </g>
  <rect width="400" height="300" filter="url(#grano)" opacity="0.07" style="mix-blend-mode: multiply"/>
</svg>
