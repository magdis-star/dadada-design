<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <filter id="agua1" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="4" seed="50" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="17" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="0.9"/>
    </filter>
    <filter id="agua2" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="13" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="1.3"/>
    </filter>
    <filter id="pluma" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grano" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="#FDF8F2"/>
  <!-- El dibujo va agrandado: en el móvil la tarjeta recorta un cuadrado pequeño. -->
  <g transform="translate(200 150) scale(1.3) translate(-200 -150)">
  <path d="M 104 204 L 196 150 L 206 170 Z" fill="#D9A441" opacity="0.62" filter="url(#agua1)"/>
  <path d="M 104 204 L 196 150 L 206 170 Z" fill="#C85D48" opacity="0.3" filter="url(#agua2)"/>
  <path d="M 196 150 q 10 -26 30 -30 q -8 18 -18 36 Z" fill="#8CA07A" opacity="0.6" filter="url(#agua2)"/>
  <path d="M 104 204 L 196 150 L 206 170 Z" fill="none" stroke="#5A4A42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" filter="url(#pluma)"/>
  <ellipse cx="258.0" cy="186.0" rx="38.0" ry="34.0" fill="#C85D48" opacity="0.55" filter="url(#agua1)"/>
  <ellipse cx="250.0" cy="178.0" rx="16.0" ry="12.0" fill="#A8492F" opacity="0.3" filter="url(#agua2)"/>
  <path d="M 246 152 q 12 -10 24 0 q -12 6 -24 0 Z" fill="#8CA07A" opacity="0.65" filter="url(#agua2)"/>
  <ellipse cx="176.0" cy="222.0" rx="60.0" ry="14.0" fill="#8CA07A" opacity="0.5" filter="url(#agua1)"/>
  <path d="M 116 222 q 60 -18 120 0 q -60 18 -120 0" fill="none" stroke="#5A4A42" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.35" filter="url(#pluma)"/>
  </g>
  <rect width="400" height="300" filter="url(#grano)" opacity="0.07" style="mix-blend-mode: multiply"/>
</svg>
