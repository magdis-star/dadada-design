  <path d="M 104 168 h -16 M 296 168 h 16" fill="none" stroke="#5A4A42" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.42" filter="url(#pluma)"/>
  </g>
  <rect width="400" height="300" filter="url(#grano)" opacity="0.07" style="mix-blend-mode: multiply"/>
