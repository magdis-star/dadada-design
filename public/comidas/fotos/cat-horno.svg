  <ellipse cx="242.4" cy="167.6" rx="16.0" ry="9.0" fill="#E8C57E" opacity="0.6" filter="url(#agua2)"/>
  <ellipse cx="149.8" cy="179.7" rx="8.0" ry="5.0" fill="#D9A441" opacity="0.55" filter="url(#agua2)"/>
  <ellipse cx="145.7" cy="177.6" rx="8.0" ry="5.0" fill="#D9A441" opacity="0.55" filter="url(#agua2)"/>
