  <ellipse cx="141.1" cy="169.2" rx="16.0" ry="9.0" fill="#E8C57E" opacity="0.6" filter="url(#agua2)"/>
  <ellipse cx="169.5" cy="187.1" rx="16.0" ry="9.0" fill="#E8C57E" opacity="0.6" filter="url(#agua2)"/>
