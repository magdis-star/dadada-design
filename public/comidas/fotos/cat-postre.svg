<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <filter id="agua1" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="4" seed="16" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="17" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="0.9"/>
    </filter>
    <filter id="agua2" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="13" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="1.3"/>
    </filter>
    <filter id="pluma" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grano" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="#FDF8F2"/>
  <!-- El dibujo va agrandado: en el móvil la tarjeta recorta un cuadrado pequeño. -->
  <g transform="translate(200 150) scale(1.3) translate(-200 -150)">
  <ellipse cx="200.0" cy="206.0" rx="104.0" ry="26.0" fill="#F0E0CB" opacity="0.45" filter="url(#agua2)"/>
  <path d="M 126 196 L 272 196 L 272 150 L 126 176 Z" fill="#E8C57E" opacity="0.6" filter="url(#agua1)"/>
  <path d="M 126 186 L 272 186 L 272 170 L 126 180 Z" fill="#F0E0CB" opacity="0.7" filter="url(#agua2)"/>
  <path d="M 126 176 L 272 150 L 272 140 L 126 168 Z" fill="#8E4B52" opacity="0.45" filter="url(#agua2)"/>
  <path d="M 126 196 L 272 196 L 272 150 L 126 176 Z" fill="none" stroke="#5A4A42" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.42" filter="url(#pluma)"/>
  <ellipse cx="246.0" cy="132.0" rx="11.0" ry="10.0" fill="#C85D48" opacity="0.6" filter="url(#agua1)"/>
  <ellipse cx="222.0" cy="138.0" rx="8.0" ry="7.0" fill="#8E4B52" opacity="0.55" filter="url(#agua2)"/>
  <path d="M 250 124 q 6 -12 16 -12 q -4 10 -16 12 Z" fill="#8CA07A" opacity="0.6" filter="url(#agua2)"/>
  </g>
  <rect width="400" height="300" filter="url(#grano)" opacity="0.07" style="mix-blend-mode: multiply"/>
</svg>
