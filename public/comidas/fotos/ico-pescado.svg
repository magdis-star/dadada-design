  <g filter="url(#agua)" opacity="0.3"><g transform="translate(100 50) scale(8)"><path fill="#F2BCA8" stroke="none" d="M2.5 12c3-4.5 8.5-5.5 13-3l5-3.5v13l-5-3.5c-4.5 2.5-10 1.5-13-3Z"/></g></g>
  <g filter="url(#pluma)"><g transform="translate(104 54) scale(8)" fill="none" stroke="#5A4A42" stroke-width="0.62" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"><path d="M2.5 12c3-4.5 8.5-5.5 13-3l5-3.5v13l-5-3.5c-4.5 2.5-10 1.5-13-3Z"/><circle cx="7" cy="11" r=".8" fill="#5A4A42"/><path d="M11 9.5c.8 1.6.8 3.4 0 5"/></g></g>
