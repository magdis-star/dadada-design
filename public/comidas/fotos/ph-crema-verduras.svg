<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <filter id="agua1" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="4" seed="75" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="17" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="0.9"/>
    </filter>
    <filter id="agua2" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="72" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="13" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="1.3"/>
    </filter>
    <filter id="pluma" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="82" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grano" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="#FDF8F2"/>
  <!-- El dibujo va agrandado: en el móvil la tarjeta recorta un cuadrado pequeño. -->
  <g transform="translate(200 150) scale(1.3) translate(-200 -150)">
  <ellipse cx="200.0" cy="168.0" rx="106.0" ry="42.0" fill="#AFA79D" opacity="0.22" filter="url(#agua2)"/>
  <ellipse cx="200.0" cy="168.0" rx="96.0" ry="34.0" fill="#8CA07A" opacity="0.5" filter="url(#agua1)"/>
  <ellipse cx="188.0" cy="164.0" rx="63.4" ry="20.4" fill="#8CA07A" opacity="0.4" filter="url(#agua2)"/>
  <path d="M 98 164 q 6 62 102 62 q 96 0 102 -62" fill="none" stroke="#5A4A42" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.45" filter="url(#pluma)"/>
  <path d="M 98 164 q 102 -30 204 0" fill="none" stroke="#5A4A42" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" filter="url(#pluma)"/>
  <ellipse cx="147.5" cy="169.8" rx="14.8" ry="6.0" fill="#D9A441" opacity="0.6" filter="url(#agua2)"/>
  <ellipse cx="250.6" cy="172.9" rx="14.4" ry="7.4" fill="#8CA07A" opacity="0.6" filter="url(#agua2)"/>
  <ellipse cx="250.1" cy="162.7" rx="13.7" ry="9.0" fill="#D9A441" opacity="0.6" filter="url(#agua2)"/>
  <ellipse cx="148.0" cy="165.1" rx="11.6" ry="8.8" fill="#D9A441" opacity="0.6" filter="url(#agua2)"/>
  <path d="M 170 102 c -8 -18 10 -24 2 -42" fill="none" stroke="#5A4A42" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.3" filter="url(#pluma)"/>
  <path d="M 214 96 c -8 -16 10 -22 2 -38" fill="none" stroke="#5A4A42" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.3" filter="url(#pluma)"/>
  </g>
  <rect width="400" height="300" filter="url(#grano)" opacity="0.07" style="mix-blend-mode: multiply"/>
</svg>
