<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <filter id="agua1" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="4" seed="16" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="17" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="0.9"/>
    </filter>
    <filter id="agua2" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="58" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="13" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="1.3"/>
    </filter>
    <filter id="pluma" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grano" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="#FDF8F2"/>
  <!-- El dibujo va agrandado: en el móvil la tarjeta recorta un cuadrado pequeño. -->
  <g transform="translate(200 150) scale(1.3) translate(-200 -150)">
  <ellipse cx="200.0" cy="176.0" rx="108.0" ry="44.0" fill="#E8C57E" opacity="0.6" filter="url(#agua1)"/>
  <ellipse cx="200.0" cy="174.0" rx="90.0" ry="34.0" fill="#C85D48" opacity="0.5" filter="url(#agua2)"/>
  <ellipse cx="193.6" cy="172.1" rx="14.0" ry="9.0" fill="#F0E0CB" opacity="0.75" filter="url(#agua2)"/>
  <ellipse cx="154.6" cy="174.4" rx="14.0" ry="9.0" fill="#F0E0CB" opacity="0.75" filter="url(#agua2)"/>
  <ellipse cx="162.5" cy="187.8" rx="14.0" ry="9.0" fill="#F0E0CB" opacity="0.75" filter="url(#agua2)"/>
  <ellipse cx="231.9" cy="163.9" rx="14.0" ry="9.0" fill="#F0E0CB" opacity="0.75" filter="url(#agua2)"/>
  <ellipse cx="161.7" cy="178.0" rx="14.0" ry="9.0" fill="#F0E0CB" opacity="0.75" filter="url(#agua2)"/>
  <ellipse cx="178.3" cy="182.4" rx="14.0" ry="9.0" fill="#F0E0CB" opacity="0.75" filter="url(#agua2)"/>
  <ellipse cx="230.4" cy="182.6" rx="14.0" ry="9.0" fill="#F0E0CB" opacity="0.75" filter="url(#agua2)"/>
  <ellipse cx="183.2" cy="166.7" rx="6.0" ry="4.0" fill="#8CA07A" opacity="0.65" filter="url(#agua2)"/>
  <ellipse cx="257.7" cy="187.3" rx="6.0" ry="4.0" fill="#8CA07A" opacity="0.65" filter="url(#agua2)"/>
  <ellipse cx="232.2" cy="171.5" rx="6.0" ry="4.0" fill="#8CA07A" opacity="0.65" filter="url(#agua2)"/>
  <ellipse cx="254.6" cy="183.1" rx="6.0" ry="4.0" fill="#8CA07A" opacity="0.65" filter="url(#agua2)"/>
  <ellipse cx="179.2" cy="183.1" rx="6.0" ry="4.0" fill="#8CA07A" opacity="0.65" filter="url(#agua2)"/>
  <path d="M 92 176 a 108 44 0 1 0 216 0 a 108 44 0 1 0 -216 0" fill="none" stroke="#5A4A42" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" filter="url(#pluma)"/>
  <path d="M 200 176 L 300 164 M 200 176 L 200 218 M 200 176 L 110 196" fill="none" stroke="#5A4A42" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.32" filter="url(#pluma)"/>
  </g>
  <rect width="400" height="300" filter="url(#grano)" opacity="0.07" style="mix-blend-mode: multiply"/>
</svg>
