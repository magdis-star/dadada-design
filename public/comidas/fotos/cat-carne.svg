<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <filter id="agua1" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="4" seed="70" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="17" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="0.9"/>
    </filter>
    <filter id="agua2" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="42" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="13" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="1.3"/>
    </filter>
    <filter id="pluma" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="77" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grano" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="#FDF8F2"/>
  <!-- El dibujo va agrandado: en el móvil la tarjeta recorta un cuadrado pequeño. -->
  <g transform="translate(200 150) scale(1.3) translate(-200 -150)">
  <ellipse cx="200.0" cy="184.0" rx="118.0" ry="42.0" fill="#F0E0CB" opacity="0.45" filter="url(#agua2)"/>
  <path d="M 128 176 q 12 -40 70 -36 q 64 4 76 34 q 8 30 -52 38 q -82 10 -94 -36 Z" fill="#8E4B52" opacity="0.5" filter="url(#agua1)"/>
  <path d="M 146 176 q 12 -26 56 -24 q 50 4 58 26 q 4 20 -42 26 q -64 6 -72 -28 Z" fill="#A8492F" opacity="0.35" filter="url(#agua2)"/>
  <path d="M 150 162 q 50 -18 104 6" fill="none" stroke="#5A4A42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.25" filter="url(#pluma)"/>
  <path d="M 128 176 q 12 -40 70 -36 q 64 4 76 34 q 8 30 -52 38 q -82 10 -94 -36" fill="none" stroke="#5A4A42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" filter="url(#pluma)"/>
  <ellipse cx="290.0" cy="206.0" rx="14.0" ry="8.0" fill="#8CA07A" opacity="0.55" filter="url(#agua2)"/>
  <ellipse cx="112.0" cy="208.0" rx="16.0" ry="9.0" fill="#D9A441" opacity="0.5" filter="url(#agua1)"/>
  </g>
  <rect width="400" height="300" filter="url(#grano)" opacity="0.07" style="mix-blend-mode: multiply"/>
</svg>
