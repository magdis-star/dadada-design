<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <filter id="agua1" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="4" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="17" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="0.9"/>
    </filter>
    <filter id="agua2" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="12" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="13" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="1.3"/>
    </filter>
    <filter id="pluma" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="16" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grano" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="#FDF8F2"/>
  <!-- El dibujo va agrandado: en el móvil la tarjeta recorta un cuadrado pequeño. -->
  <g transform="translate(200 150) scale(1.3) translate(-200 -150)">
  <ellipse cx="200.0" cy="180.0" rx="104.0" ry="42.0" fill="#C85D48" opacity="0.42" filter="url(#agua1)"/>
  <ellipse cx="196.0" cy="176.0" rx="74.0" ry="28.0" fill="#A8492F" opacity="0.3" filter="url(#agua2)"/>
  <ellipse cx="235.3" cy="188.7" rx="22.0" ry="18.0" fill="#8E4B52" opacity="0.55" filter="url(#agua2)"/>
  <path d="M 215.32793800193977 188.7298610628342 a 20 17 0 0 1 40 0" fill="none" stroke="#5A4A42" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" opacity="0.38" filter="url(#pluma)"/>
  <ellipse cx="173.4" cy="192.3" rx="22.0" ry="18.0" fill="#8E4B52" opacity="0.55" filter="url(#agua1)"/>
  <path d="M 153.36617267873766 192.32775860244976 a 20 17 0 0 1 40 0" fill="none" stroke="#5A4A42" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" opacity="0.38" filter="url(#pluma)"/>
  <ellipse cx="167.5" cy="165.8" rx="22.0" ry="18.0" fill="#8E4B52" opacity="0.55" filter="url(#agua2)"/>
  <path d="M 147.54958844254156 165.8439354683993 a 20 17 0 0 1 40 0" fill="none" stroke="#5A4A42" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" opacity="0.38" filter="url(#pluma)"/>
  <ellipse cx="220.9" cy="162.2" rx="22.0" ry="18.0" fill="#8E4B52" opacity="0.55" filter="url(#agua1)"/>
  <path d="M 200.91049622067217 162.16257420766433 a 20 17 0 0 1 40 0" fill="none" stroke="#5A4A42" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" opacity="0.38" filter="url(#pluma)"/>
  <path d="M 96 180 q 104 54 208 0" fill="none" stroke="#5A4A42" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.42" filter="url(#pluma)"/>
  </g>
  <rect width="400" height="300" filter="url(#grano)" opacity="0.07" style="mix-blend-mode: multiply"/>
</svg>
